name: Stagewise checks
on: [push, pull_request]
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e './CoPH-Stagewise[dev]'
      - run: python -m pytest tests -q
        working-directory: CoPH-Stagewise
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg

      - run: python benchmarks/scenario_baselines/audit.py verify
      - run: python -m unittest discover -s benchmarks/scenario_baselines -p "test_*.py" -v

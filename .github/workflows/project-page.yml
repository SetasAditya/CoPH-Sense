name: Publish project page
on:
  push:
    branches: [main]
    paths: ['project-page/dist/**', '.github/workflows/project-page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: project-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project-page/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

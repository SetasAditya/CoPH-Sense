[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coph-stagewise"
version = "0.1.0"
description = "Stagewise cooperative port-Hamiltonian navigation and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "torch>=2.4", "matplotlib>=3.7", "Pillow>=9.4", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-subtests>=0.13"]

[project.scripts]
coph-stagewise = "coph_stagewise.cli:main"

[tool.setuptools.packages.find]
include = ["coph_stagewise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
